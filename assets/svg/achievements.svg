<svg width="880" height="234" viewBox="0 0 880 234" xmlns="http://www.w3.org/2000/svg">
  <style>
    @font-face {
      font-family: 'Instrument Serif';
      src: url('../fonts/InstrumentSerif-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }
    .rise { opacity: 0; animation: rise .55s cubic-bezier(.2,.7,.3,1) forwards; }
    .a0 { animation-delay: .06s } .a1 { animation-delay: .14s } .a2 { animation-delay: .22s } .a3 { animation-delay: .30s }
    .a4 { animation-delay: .38s } .a5 { animation-delay: .46s } .a6 { animation-delay: .54s }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .rise { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
    .h2 { font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; fill: #ECEEEF; }
    .acr { font-family: 'Instrument Serif', Georgia, serif; font-size: 19px; fill: #3FA79D; text-anchor: middle; }
    .award { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ECEEEF; text-anchor: middle; }
    .desc { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 11px; fill: #9aa0a8; text-anchor: middle; }
    .card { fill: #11151c; stroke: #242932; stroke-width: 1; }
  </style>

  <text x="16" y="30" class="h2">Research &amp; Achievements</text>
  <rect x="17" y="38" width="44" height="2" fill="#FB923C"/>

  <!-- card template: 198x78, cols x=20,234,448,662 rows y=56,148 -->

  <g class="rise a0">
    <rect class="card" x="20" y="56" width="198" height="78" rx="6"/>
    <text class="acr" x="119" y="80">SOHAR</text>
    <text class="award" x="119" y="98">2nd Place</text>
    <text class="desc" x="119" y="114">2026 &#183; Nasaq</text>
  </g>

  <g class="rise a1">
    <rect class="card" x="234" y="56" width="198" height="78" rx="6"/>
    <text class="acr" x="333" y="80">OMANTEL</text>
    <text class="award" x="333" y="98">Winner</text>
    <text class="desc" x="333" y="114">2025 &#183; Wasl-AI</text>
  </g>

  <g class="rise a2">
    <rect class="card" x="448" y="56" width="198" height="78" rx="6"/>
    <text class="acr" x="547" y="80">MULHIM</text>
    <text class="award" x="547" y="98">Best Applicable Project</text>
    <text class="desc" x="547" y="114">2025 &#183; Mdawi</text>
  </g>

  <g class="rise a3">
    <rect class="card" x="662" y="56" width="198" height="78" rx="6"/>
    <text class="acr" x="761" y="80">ICCBE</text>
    <text class="award" x="761" y="98">Best Conference Paper</text>
    <text class="desc" x="761" y="114">2025 &#183; IEEE</text>
  </g>

  <g class="rise a4">
    <rect class="card" x="20" y="148" width="198" height="78" rx="6"/>
    <text class="acr" x="119" y="172">PYHACK</text>
    <text class="award" x="119" y="190">2nd Place</text>
    <text class="desc" x="119" y="206">2025 &#183; GCET</text>
  </g>

  <g class="rise a5">
    <rect class="card" x="234" y="148" width="198" height="78" rx="6"/>
    <text class="acr" x="333" y="172">DHOFAR</text>
    <text class="award" x="333" y="190">Top 3 of 49+</text>
    <text class="desc" x="333" y="206">2024 &#183; CPC</text>
  </g>

  <g class="rise a6">
    <rect class="card" x="448" y="148" width="198" height="78" rx="6"/>
    <text class="acr" x="547" y="172">IEEE</text>
    <text class="award" x="547" y="190">Best Research Paper</text>
    <text class="desc" x="547" y="206">2024 &#183; Aqua Sink Pro</text>
  </g>
</svg>
