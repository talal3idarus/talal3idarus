<svg width="880" height="728" viewBox="0 0 880 728" xmlns="http://www.w3.org/2000/svg">
  <style>
    @font-face {
      font-family: 'Instrument Serif';
      src: url('../fonts/InstrumentSerif-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }
    .prise { opacity: 0; animation: prise .55s cubic-bezier(.2,.7,.3,1) forwards; }
    .c0 { animation-delay: .06s } .c1 { animation-delay: .14s } .c2 { animation-delay: .22s }
    .c3 { animation-delay: .30s } .c4 { animation-delay: .38s } .c5 { animation-delay: .46s }
    .c6 { animation-delay: .54s } .c7 { animation-delay: .62s } .c8 { animation-delay: .70s }
    .c9 { animation-delay: .78s } .c10 { animation-delay: .86s } .c11 { animation-delay: .94s } .c12 { animation-delay: 1.02s }
    @keyframes prise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .prise { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
    .h2 { font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; fill: #ECEEEF; }
    .pnum { font-family: 'Instrument Serif', Georgia, serif; font-size: 20px; fill: #3FA79D; }
    .ptitle { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ECEEEF; }
    .pdesc { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .card { fill: #11151c; stroke: #242932; stroke-width: 1; }
  </style>

  <text x="16" y="30" class="h2">Featured Projects</text>
  <rect x="17" y="38" width="44" height="2" fill="#FB923C"/>

  <!-- row 1: 2 cols, 412 wide x 136 tall, x=20,448 y=56 -->

  <g class="prise c0">
    <rect class="card" x="20" y="56" width="412" height="136" rx="6"/>
    <text class="pnum" x="36" y="88">01</text>
    <text class="ptitle" x="36" y="112">Mdawi</text>
    <text class="pdesc" x="36" y="136" textLength="380" lengthAdjust="spacingAndGlyphs">A smart health app for elderly and chronic disease patients &#8212;</text>
    <text class="pdesc" x="36" y="154" textLength="380" lengthAdjust="spacingAndGlyphs">personalised medication reminders, Omani-dialect voice alerts,</text>
    <text class="pdesc" x="36" y="172">appointment tracking, adherence insights, and caregiver dashboards.</text>
  </g>

  <g class="prise c1">
    <rect class="card" x="448" y="56" width="412" height="136" rx="6"/>
    <text class="pnum" x="464" y="88">02</text>
    <text class="ptitle" x="464" y="112">UTAS-hub</text>
    <text class="pdesc" x="464" y="136" textLength="380" lengthAdjust="spacingAndGlyphs">A university-wide platform connecting over 3,000 students at</text>
    <text class="pdesc" x="464" y="154" textLength="380" lengthAdjust="spacingAndGlyphs">UTAS with course summaries, campus events, and shared</text>
    <text class="pdesc" x="464" y="172">academic resources &#8212; built to make student life easier.</text>
  </g>

  <!-- row 2: 2 cols, 412 wide x 136 tall, x=20,448 y=206 -->

  <g class="prise c2">
    <rect class="card" x="20" y="206" width="412" height="136" rx="6"/>
    <text class="pnum" x="36" y="238">03</text>
    <text class="ptitle" x="36" y="262">Nasaq</text>
    <text class="pdesc" x="36" y="286" textLength="380" lengthAdjust="spacingAndGlyphs">An AI-powered port operations platform turning infrastructure</text>
    <text class="pdesc" x="36" y="304" textLength="380" lengthAdjust="spacingAndGlyphs">into real-time intelligence &#8212; vehicle tracking, congestion</text>
    <text class="pdesc" x="36" y="322">monitoring &amp; CO2 visibility &#8212; 2nd of 900+ ideas, SOHAR hackathon.</text>
  </g>

  <g class="prise c3">
    <rect class="card" x="448" y="206" width="412" height="136" rx="6"/>
    <text class="pnum" x="464" y="238">04</text>
    <text class="ptitle" x="464" y="262">Wasl-AI</text>
    <text class="pdesc" x="464" y="286" textLength="380" lengthAdjust="spacingAndGlyphs">A WhatsApp AI assistant automating scheduling, email, and</text>
    <text class="pdesc" x="464" y="304" textLength="380" lengthAdjust="spacingAndGlyphs">CRM tasks, with Gmail/Calendar sync, FAQ handling, and an</text>
    <text class="pdesc" x="464" y="322">operator dashboard. Winner, Omantel AI Hackathon.</text>
  </g>

  <!-- row 3: 3 cols, 269 wide x 112 tall, x=20,305,590 y=356 -->

  <g class="prise c4">
    <rect class="card" x="20" y="356" width="269" height="112" rx="6"/>
    <text class="pnum" x="36" y="388">05</text>
    <text class="ptitle" x="36" y="412">Pathfinder</text>
    <text class="pdesc" x="36" y="436">AI-powered career guidance</text>
    <text class="pdesc" x="36" y="454">platform for students</text>
  </g>

  <g class="prise c5">
    <rect class="card" x="305" y="356" width="269" height="112" rx="6"/>
    <text class="pnum" x="321" y="388">06</text>
    <text class="ptitle" x="321" y="412">ZiraTech</text>
    <text class="pdesc" x="321" y="436">Agri-tech marketplace with AI</text>
    <text class="pdesc" x="321" y="454">plant scanner for crop health</text>
  </g>

  <g class="prise c6">
    <rect class="card" x="590" y="356" width="269" height="112" rx="6"/>
    <text class="pnum" x="606" y="388">07</text>
    <text class="ptitle" x="606" y="412">AI Clustering</text>
    <text class="pdesc" x="606" y="436">Machine learning clustering</text>
    <text class="pdesc" x="606" y="454">algorithms implementation</text>
  </g>

  <!-- row 4: 3 cols, 269 wide x 112 tall, x=20,305,590 y=482 -->

  <g class="prise c7">
    <rect class="card" x="20" y="482" width="269" height="112" rx="6"/>
    <text class="pnum" x="36" y="514">08</text>
    <text class="ptitle" x="36" y="538">Aqua Sink Pro</text>
    <text class="pdesc" x="36" y="562">IoT-based water management</text>
    <text class="pdesc" x="36" y="580">solution</text>
  </g>

  <g class="prise c8">
    <rect class="card" x="305" y="482" width="269" height="112" rx="6"/>
    <text class="pnum" x="321" y="514">09</text>
    <text class="ptitle" x="321" y="538">Voice Identity Shield</text>
    <text class="pdesc" x="321" y="562">AI-powered voice identity</text>
    <text class="pdesc" x="321" y="580">verification &amp; security</text>
  </g>

  <g class="prise c9">
    <rect class="card" x="590" y="482" width="269" height="112" rx="6"/>
    <text class="pnum" x="606" y="514">10</text>
    <text class="ptitle" x="606" y="538">BankSohar File Manager</text>
    <text class="pdesc" x="606" y="562">OCR-backed document</text>
    <text class="pdesc" x="606" y="580">management &amp; automated filing</text>
  </g>

  <!-- row 5: 3 cols, 269 wide x 112 tall, x=20,305,590 y=608 -->

  <g class="prise c10">
    <rect class="card" x="20" y="608" width="269" height="112" rx="6"/>
    <text class="pnum" x="36" y="640">11</text>
    <text class="ptitle" x="36" y="664">Home Grocery</text>
    <text class="pdesc" x="36" y="688">E-commerce platform with secure</text>
    <text class="pdesc" x="36" y="706">payment processing</text>
  </g>

  <g class="prise c11">
    <rect class="card" x="305" y="608" width="269" height="112" rx="6"/>
    <text class="pnum" x="321" y="640">12</text>
    <text class="ptitle" x="321" y="664">ShuffleBite</text>
    <text class="pdesc" x="321" y="688">Flutter meal planning app that</text>
    <text class="pdesc" x="321" y="706">ends decision fatigue</text>
  </g>

  <g class="prise c12">
    <rect class="card" x="590" y="608" width="269" height="112" rx="6"/>
    <text class="pnum" x="606" y="640">13</text>
    <text class="ptitle" x="606" y="664">Sasa</text>
    <text class="pdesc" x="606" y="688">Desktop AI assistant that executes</text>
    <text class="pdesc" x="606" y="706">tasks via natural language</text>
  </g>
</svg>
